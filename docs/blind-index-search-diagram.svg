<svg viewBox="0 0 1000 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blind index search: the app hashes each search term with a secret key and looks up matching hashes in the database, so it can find a record without ever decrypting it or storing the search term in the clear." color="#1e293b" font-family="Helvetica, Arial, sans-serif">
  <title>Blind Index and Encrypted Search</title>
  <desc>Two flows. Indexing at write time: the plaintext value is split into tokens (the full value, individual words, a 3-character prefix), each token is hashed with SHA-256 keyed by a secret held only in the app's environment, and the resulting hashes are stored in vault_search_index alongside a pointer (entity_ref) to the already-encrypted record — the index table never holds plaintext or the record's content. Searching at query time: a plaintext search term is hashed the same way, the app looks up rows in vault_search_index whose index_hash matches exactly, filters matches by the caller's permissions, and returns only a reference key and flavor — never the decrypted value. Reading the actual record still requires the separate fetch/KMS-unwrap path.</desc>

  <rect x="0.5" y="0.5" width="999" height="859" rx="14" fill="#fbfaf9" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Blind Index: Searching Data You Can't Read</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#475569">The database never sees a search term in the clear — only a keyed fingerprint of it. Matching fingerprints finds the record; it never decrypts it.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <g id="key">
      <circle cx="-3" cy="0" r="2.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <path d="M -0.6 0 H 5.5 M 2.5 0 V 2.2 M 4.5 0 V 2.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
    </g>
    <g id="lock">
      <path d="M -3 -1 V -4 A 3 3 0 0 1 3 -4 V -1" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <rect x="-5" y="-1" width="10" height="7.5" rx="1.4" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4"/>
    </g>
  </defs>

  <!-- ============ LANE A: INDEXING ============ -->
  <text x="30" y="88" font-size="14" font-weight="700" fill="#0f172a">1. Indexing a record (write time)</text>

  <!-- Plaintext value pill -->
  <rect x="20" y="170" width="150" height="56" rx="28" fill="#f0fdf4" stroke="#14532d" stroke-width="1.4"/>
  <text x="95" y="194" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">"Jane Doe"</text>
  <text x="95" y="210" text-anchor="middle" font-size="9.5" fill="#166534">plaintext value</text>

  <!-- Tokenize box -->
  <rect x="205" y="115" width="175" height="170" rx="8" fill="#f0fdf4" stroke="#14532d" stroke-width="1.4"/>
  <text x="292" y="135" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">tokenize</text>
  <rect x="220" y="145" width="145" height="24" rx="4" fill="#dcfce7"/>
  <text x="292" y="161" text-anchor="middle" font-size="10" fill="#14532d">FULL → "JANE DOE"</text>
  <rect x="220" y="173" width="145" height="24" rx="4" fill="#dcfce7"/>
  <text x="292" y="189" text-anchor="middle" font-size="10" fill="#14532d">PART → "JANE"</text>
  <rect x="220" y="201" width="145" height="24" rx="4" fill="#dcfce7"/>
  <text x="292" y="217" text-anchor="middle" font-size="10" fill="#14532d">PART → "DOE"</text>
  <rect x="220" y="229" width="145" height="24" rx="4" fill="#dcfce7"/>
  <text x="292" y="245" text-anchor="middle" font-size="10" fill="#14532d">PREFIX → "JAN"</text>
  <text x="292" y="266" text-anchor="middle" font-size="9" fill="#4d7c0f">one token per search shape</text>

  <!-- Keyed hash box -->
  <rect x="415" y="130" width="195" height="140" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4"/>
  <use href="#key" x="437" y="152" color="#92400e"/>
  <text x="512" y="156" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">keyed hash</text>
  <text x="512" y="178" text-anchor="middle" font-size="10.5" fill="#92400e">SHA-256(secret + token)</text>
  <line x1="430" y1="192" x2="595" y2="192" stroke="#b45309" stroke-width="1"/>
  <text x="512" y="210" text-anchor="middle" font-size="9.5" fill="#a16207">secret = TSI_PRIVACY_VAULT_INDEX_SECRET</text>
  <text x="512" y="226" text-anchor="middle" font-size="9.5" fill="#a16207">held only in the app's env —</text>
  <text x="512" y="242" text-anchor="middle" font-size="9.5" fill="#a16207">never written to the database</text>
  <text x="512" y="260" text-anchor="middle" font-size="9.5" font-weight="700" fill="#92400e">same input → same hash, always</text>

  <!-- vault_search_index table -->
  <rect x="650" y="100" width="320" height="185" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.4"/>
  <text x="810" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">vault_search_index</text>
  <text x="668" y="140" font-size="9.5" font-weight="700" fill="#1e3a8a">index_hash</text>
  <text x="820" y="140" font-size="9.5" font-weight="700" fill="#1e3a8a">attribute_type</text>
  <line x1="663" y1="146" x2="963" y2="146" stroke="#93c5fd" stroke-width="1"/>
  <text x="668" y="163" font-size="10" font-family="monospace" fill="#1e3a8a">a13f9c…e2 </text>
  <text x="820" y="163" font-size="10" fill="#1e3a8a">FULL</text>
  <text x="668" y="185" font-size="10" font-family="monospace" fill="#1e3a8a">7d02b1…4f </text>
  <text x="820" y="185" font-size="10" fill="#1e3a8a">PART</text>
  <text x="668" y="207" font-size="10" font-family="monospace" fill="#1e3a8a">c98e5a…31 </text>
  <text x="820" y="207" font-size="10" fill="#1e3a8a">PART</text>
  <text x="668" y="229" font-size="10" font-family="monospace" fill="#1e3a8a">4b7fd0…a8 </text>
  <text x="820" y="229" font-size="10" fill="#1e3a8a">PREFIX</text>
  <text x="810" y="252" text-anchor="middle" font-size="9.5" fill="#3b5f9e">each row also carries entity_ref →</text>
  <text x="810" y="267" text-anchor="middle" font-size="9.5" fill="#3b5f9e">a pointer, not the data</text>

  <!-- Arrows lane A -->
  <line x1="170" y1="198" x2="201" y2="198" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="380" y1="198" x2="411" y2="198" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="610" y1="198" x2="646" y2="198" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="628" y="188" text-anchor="middle" font-size="9.5" fill="#334155">insert row</text>

  <!-- pointer to the encrypted record -->
  <line x1="810" y1="285" x2="810" y2="308" stroke="#1e3a8a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="640" y="310" width="340" height="34" rx="6" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.2"/>
  <use href="#lock" x="663" y="327" color="#1e3a8a"/>
  <text x="815" y="331" text-anchor="middle" font-size="10" fill="#1e3a8a">vault_entities row — encrypted_content + encrypted_data_key</text>

  <!-- Divider -->
  <line x1="20" y1="372" x2="980" y2="372" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============ LANE B: SEARCHING ============ -->
  <text x="30" y="404" font-size="14" font-weight="700" fill="#0f172a">2. Searching (query time)</text>

  <!-- Search term pill -->
  <rect x="20" y="455" width="150" height="56" rx="28" fill="#f0fdf4" stroke="#14532d" stroke-width="1.4"/>
  <text x="95" y="479" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">"Jane"</text>
  <text x="95" y="495" text-anchor="middle" font-size="9.5" fill="#166534">plaintext search term</text>

  <!-- Keyed hash box (query) -->
  <rect x="205" y="430" width="195" height="105" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4"/>
  <use href="#key" x="227" y="452" color="#92400e"/>
  <text x="302" y="456" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">keyed hash</text>
  <text x="302" y="476" text-anchor="middle" font-size="10.5" fill="#92400e">SHA-256(secret + "JANE")</text>
  <text x="302" y="500" text-anchor="middle" font-size="10" font-family="monospace" font-weight="700" fill="#0f766e">= 7d02b1…4f</text>
  <text x="302" y="518" text-anchor="middle" font-size="9" fill="#a16207">same secret, same recipe</text>

  <!-- Lookup box -->
  <rect x="440" y="410" width="270" height="145" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.4"/>
  <text x="575" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">vault_search_index</text>
  <text x="575" y="447" text-anchor="middle" font-size="10" fill="#1e3a8a">WHERE index_hash = ?</text>
  <rect x="458" y="456" width="234" height="24" rx="4" fill="#fde68a" stroke="#0f766e" stroke-width="1.3"/>
  <text x="575" y="472" text-anchor="middle" font-size="10" font-family="monospace" font-weight="700" fill="#0f172a">7d02b1…4f → PART match</text>
  <rect x="458" y="484" width="234" height="20" rx="4" fill="#eff6ff" opacity="0.5"/>
  <text x="575" y="498" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="monospace">a13f9c…e2, c98e5a…31 (no match)</text>
  <text x="575" y="518" text-anchor="middle" font-size="9.5" fill="#3b5f9e">exact-match lookup, no decryption</text>
  <text x="575" y="534" text-anchor="middle" font-size="9.5" fill="#3b5f9e">resolves to the row's entity_ref</text>

  <!-- Authorize gate -->
  <rect x="440" y="585" width="270" height="70" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
  <text x="575" y="607" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">isAuthorized(apiKey, entity_code)</text>
  <text x="575" y="625" text-anchor="middle" font-size="9.5" fill="#475569">joins permissions + vault_entity_master</text>
  <text x="575" y="641" text-anchor="middle" font-size="9.5" fill="#475569">drops matches the caller can't read</text>

  <!-- Output pill -->
  <rect x="760" y="592" width="210" height="56" rx="28" fill="#f0fdf4" stroke="#14532d" stroke-width="1.4"/>
  <text x="865" y="614" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">reference_key + flavor</text>
  <text x="865" y="630" text-anchor="middle" font-size="9.5" fill="#166534">not the decrypted value</text>

  <!-- Arrows lane B -->
  <line x1="170" y1="483" x2="201" y2="483" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="400" y1="483" x2="436" y2="483" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="575" y1="555" x2="575" y2="581" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="710" y1="620" x2="756" y2="620" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="865" y="672" text-anchor="middle" font-size="9.5" fill="#64748b">still needs fetch_data() + the KMS unwrap path</text>
  <text x="865" y="687" text-anchor="middle" font-size="9.5" fill="#64748b">(see envelope-encryption-diagram.svg) to read the plaintext</text>

  <!-- Caption -->
  <line x1="20" y1="718" x2="980" y2="718" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="746" text-anchor="middle" font-size="12.5" font-style="italic" fill="#475569">
    "Search works by recomputing the same fingerprint and matching hashes — never by decrypting.
  </text>
  <text x="500" y="766" text-anchor="middle" font-size="12.5" font-style="italic" fill="#475569">
    Lose the database and an attacker has fingerprints they can't reverse, without the secret that makes them."
  </text>
  <text x="500" y="798" text-anchor="middle" font-size="11" fill="#64748b">encrypted_content uses a random IV per record — it never repeats, so it can't be searched. index_hash is deterministic on purpose: that's what makes equality lookup possible.</text>
  <text x="500" y="818" text-anchor="middle" font-size="11" fill="#64748b">Without TSI_PRIVACY_VAULT_INDEX_SECRET, even guessing the plaintext correctly doesn't produce a matching hash — the index resists offline dictionary attacks.</text>
</svg>
