<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Envelope encryption with AWS KMS: the app locks each record with a one-time data key, then AWS KMS wraps that key with a master key that never leaves AWS." color="#1e293b" font-family="Helvetica, Arial, sans-serif">
  <title>Envelope Encryption with AWS KMS</title>
  <desc>Two flows. Storing: the app asks AWS KMS for a new data key, gets back a plaintext copy and an encrypted copy, uses the plaintext copy to encrypt the record, discards it, and stores both the encrypted content and the encrypted data key in the database. Reading: the app reads both stored values, sends the encrypted data key to AWS KMS to be unwrapped using the master key (which never leaves AWS), receives the plaintext data key, uses it to decrypt the content, then discards it.</desc>

  <rect x="0.5" y="0.5" width="999" height="759" rx="14" fill="#fbfaf9" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Envelope Encryption: a Locked Box Inside a Bank Vault</text>
  <text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#475569">AWS's master key never touches record data directly — it only ever wraps the small, one-time key that does.</text>

  <!-- Definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <g id="lock">
      <path d="M -3 -1 V -4 A 3 3 0 0 1 3 -4 V -1" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <rect x="-5" y="-1" width="10" height="7.5" rx="1.4" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4"/>
    </g>
    <g id="unlock">
      <path d="M -3 -1 V -4 A 3 3 0 0 1 3 -4 V -2.4" fill="none" stroke="currentColor" stroke-width="1.4" transform="rotate(-24 -3 -4)"/>
      <rect x="-5" y="-1" width="10" height="7.5" rx="1.4" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.4"/>
    </g>
  </defs>

  <!-- ============ LANE A: STORING ============ -->
  <text x="40" y="88" font-size="14" font-weight="700" fill="#0f172a">1. Storing a record (encryption path)</text>

  <!-- Database box -->
  <rect x="40" y="100" width="210" height="150" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.4"/>
  <text x="145" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Database row</text>
  <use href="#lock" x="63" y="150" color="#1e3a8a"/>
  <text x="78" y="153" font-size="11.5" fill="#1e3a8a">encrypted_content</text>
  <use href="#lock" x="63" y="190" color="#1e3a8a"/>
  <text x="78" y="193" font-size="11.5" fill="#1e3a8a">encrypted_data_key</text>
  <text x="145" y="228" text-anchor="middle" font-size="10" fill="#64748b">neither is useful without the other</text>

  <!-- App box -->
  <rect x="430" y="100" width="170" height="150" rx="8" fill="#f0fdf4" stroke="#14532d" stroke-width="1.4"/>
  <text x="515" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">App</text>
  <text x="515" y="170" text-anchor="middle" font-size="10.5" fill="#166534">holds plaintext DEK</text>
  <text x="515" y="185" text-anchor="middle" font-size="10.5" fill="#166534">only for this moment,</text>
  <text x="515" y="200" text-anchor="middle" font-size="10.5" fill="#166534">then discards it</text>

  <!-- KMS boundary box -->
  <rect x="760" y="90" width="200" height="170" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="860" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">AWS KMS (boundary)</text>
  <rect x="800" y="150" width="120" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <use href="#lock" x="825" y="180" color="#92400e"/>
  <text x="870" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Master Key</text>
  <text x="870" y="196" text-anchor="middle" font-size="9.5" fill="#92400e">never leaves</text>
  <text x="860" y="242" text-anchor="middle" font-size="10" fill="#a16207">arn:aws:kms:...key/034b9e26-...</text>

  <!-- Arrows lane A -->
  <line x1="600" y1="150" x2="756" y2="150" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="678" y="141" text-anchor="middle" font-size="10.5" fill="#334155">1 request new data key</text>

  <line x1="756" y1="196" x2="600" y2="196" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="678" y="212" text-anchor="middle" font-size="10.5" fill="#0f766e">2 returns plaintext DEK + encrypted DEK</text>

  <line x1="430" y1="175" x2="254" y2="175" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="340" y="166" text-anchor="middle" font-size="10.5" fill="#334155">3 write encrypted_content</text>
  <text x="340" y="188" text-anchor="middle" font-size="10.5" fill="#334155">+ encrypted_data_key</text>

  <!-- Divider -->
  <line x1="30" y1="278" x2="970" y2="278" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============ LANE B: READING ============ -->
  <text x="40" y="312" font-size="14" font-weight="700" fill="#0f172a">2. Reading a record (decryption path)</text>

  <!-- Database box -->
  <rect x="40" y="325" width="210" height="150" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.4"/>
  <text x="145" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Database row</text>
  <use href="#lock" x="63" y="375" color="#1e3a8a"/>
  <text x="78" y="378" font-size="11.5" fill="#1e3a8a">encrypted_content</text>
  <use href="#lock" x="63" y="415" color="#1e3a8a"/>
  <text x="78" y="418" font-size="11.5" fill="#1e3a8a">encrypted_data_key</text>

  <!-- App box -->
  <rect x="430" y="325" width="170" height="150" rx="8" fill="#f0fdf4" stroke="#14532d" stroke-width="1.4"/>
  <text x="515" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">App</text>

  <!-- KMS boundary box -->
  <rect x="760" y="315" width="200" height="170" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="860" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">AWS KMS (boundary)</text>
  <rect x="800" y="375" width="120" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <use href="#lock" x="825" y="405" color="#92400e"/>
  <text x="870" y="401" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Master Key</text>
  <text x="870" y="421" text-anchor="middle" font-size="9.5" fill="#92400e">unwraps, then stays put</text>

  <!-- Arrows lane B -->
  <line x1="254" y1="358" x2="430" y2="358" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="342" y="349" text-anchor="middle" font-size="10.5" fill="#334155">1 read encrypted_content + encrypted_data_key</text>

  <line x1="600" y1="403" x2="756" y2="403" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="678" y="394" text-anchor="middle" font-size="10.5" fill="#334155">2 request decrypt(encrypted_data_key)</text>

  <line x1="756" y1="449" x2="600" y2="449" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="678" y="465" text-anchor="middle" font-size="10.5" fill="#0f766e">3 returns plaintext DEK</text>

  <line x1="515" y1="475" x2="515" y2="520" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="600" y="500" font-size="10.5" fill="#0f766e">4 unlock encrypted_content with DEK,</text>
  <text x="600" y="516" font-size="10.5" fill="#0f766e">then discard DEK from memory</text>

  <!-- Plaintext output pill -->
  <rect x="430" y="522" width="170" height="46" rx="23" fill="#f0fdf4" stroke="#14532d" stroke-width="1.4"/>
  <use href="#unlock" x="463" y="546" color="#14532d"/>
  <text x="480" y="549" font-size="11.5" fill="#14532d">plaintext data</text>

  <!-- Caption -->
  <line x1="30" y1="600" x2="970" y2="600" stroke="#e2e8f0" stroke-width="1"/>
  <text x="500" y="630" text-anchor="middle" font-size="12.5" font-style="italic" fill="#475569">
    "Every record gets its own one-time key that encrypts the data; that key is itself encrypted by AWS's master key before we store it —
  </text>
  <text x="500" y="650" text-anchor="middle" font-size="12.5" font-style="italic" fill="#475569">
    so the master key never directly touches your data, it only ever protects the little keys."
  </text>
  <text x="500" y="682" text-anchor="middle" font-size="11" fill="#64748b">If the database is stolen: two locked things, no key that opens either — unlocking even one record still requires AWS KMS itself (gated by IAM).</text>
  <text x="500" y="702" text-anchor="middle" font-size="11" fill="#64748b">Rotating the master key (e.g. LOCAL → AWS_KMS) only re-wraps the small per-record keys — the underlying data is never touched.</text>
</svg>
