base.url=http://localhost:8081

# Client API key and secret with READ and WRITE on entity.code, and READ on utility.id.
# The raw secret is shown once when the key is created.
api.key=REPLACE_WITH_TEST_API_KEY
api.secret=REPLACE_WITH_TEST_API_SECRET

# An active entity type (flavor ID or DATA) the API key can read and write
entity.code=REPLACE_WITH_ENTITY_CODE
entity.type=ID

# A value already stored under entity.code, used by the search stage
search.term=REPLACE_WITH_SEEDED_SEARCH_TERM

# An enrolled utility the API key can read, used by the resolve stage
utility.id=REPLACE_WITH_UTILITY_ID

ramp.up.seconds=5

store.threads=5
store.loops=40

round_trip.threads=5
round_trip.loops=40

search.threads=10
search.loops=100

discovery.threads=5
discovery.loops=40

utility_resolve.threads=5
utility_resolve.loops=40
